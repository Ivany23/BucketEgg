patchedDependencies:
  exceljs@4.4.0: patches/exceljs@4.4.0.patch

# pnpm 10 não corre scripts de instalação das dependências sem autorização. Nenhum é preciso aqui:
# - o "postinstall" do projeto já corre "prisma generate" (e o Prisma descarrega os motores);
# - o bcrypt 6 traz binários pré-compilados (carregados por node-gyp-build ao arrancar);
# - @scarf/scarf é telemetria e o @swc/core já traz o binário da plataforma.
# Declarados como ignorados de propósito, para o build não mostrar o aviso "Ignored build scripts".
ignoredBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - '@swc/core'
  - bcrypt
  - prisma
